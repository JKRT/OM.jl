name: Julia nightly
# Forward-guard against the next Julia. Not part of PR gating: runs on a
# weekly schedule and manual dispatch only, so a break here never blocks a
# merge.
on:
  workflow_dispatch:
  schedule:
    - cron: '11 7 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-nightly:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['nightly']
        os: [ubuntu-latest, windows-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Add registries + instantiate
        shell: bash
        run: |
          julia --color=yes --project -e '
            import Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git"))
            Pkg.instantiate()
            Pkg.build(; verbose=true)'
      - uses: julia-actions/julia-runtest@v1
