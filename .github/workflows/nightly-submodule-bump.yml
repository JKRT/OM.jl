name: Nightly submodule bump and rebuild

# Every day:
#   1. Bump every OpenModelica-hosted submodule (url contains "OpenModelica/")
#      to the tip of its upstream default branch. JKRT-hosted forks are left
#      untouched.
#   2. Do a full rebuild (install_dev.jl) against the updated submodules.
#   3. If the bump produced changes and the rebuild succeeds, open/update a PR.
#
# Scheduled workflows only run from the repository's default branch.

on:
  schedule:
    - cron: '17 1 * * *'   # 01:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  nightly:
    name: Bump OpenModelica submodules + rebuild
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Bump OpenModelica-hosted submodules to upstream default branch
        id: bump
        run: |
          set -euo pipefail
          names=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
                  | sed -E 's/^submodule\.(.*)\.path .*/\1/')
          for name in $names; do
            path=$(git config -f .gitmodules --get "submodule.$name.path")
            url=$(git config -f .gitmodules --get "submodule.$name.url")
            case "$url" in
              *OpenModelica/*)
                git -C "$path" remote set-head origin -a >/dev/null 2>&1 || true
                def=$(git -C "$path" symbolic-ref --quiet --short refs/remotes/origin/HEAD 2>/dev/null \
                      | sed 's@^origin/@@' || true)
                def=${def:-master}
                echo "Updating $path -> origin/$def"
                git -C "$path" fetch -q origin "$def"
                git -C "$path" checkout -q "origin/$def"
                git add "$path"
                ;;
              *)
                echo "Skipping non-OpenModelica submodule $path ($url)"
                ;;
            esac
          done
          if git diff --cached --quiet; then
            echo "No OpenModelica submodule updates available."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Submodule pointer changes staged:"
            git diff --cached --submodule=short | grep -E '^(diff|[+-]Subproject)' || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      # Always rebuild — this validates the current (or freshly bumped) submodule
      # set against the live registries, catching upstream breakage even on days
      # with no pointer changes.
      - name: Nightly rebuild (install_dev.jl)
        run: julia --project=. install_dev.jl

      - name: Open / update pull request with the submodule bumps
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="nightly/submodule-bump"
          today=$(date -u +%Y-%m-%d)
          git config user.name "om-nightly-bot"
          git config user.email "om-nightly-bot@users.noreply.github.com"
          # Carry the staged gitlink bumps onto the PR branch and commit only them
          # (the rebuild may have touched Manifest.toml etc.; `git commit` without
          # -a commits the staged submodule pointers only).
          git checkout -B "$branch"
          git commit -m "Nightly: bump OpenModelica submodules ($today)"
          git push -f origin "$branch"
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "PR for $branch already open — branch updated."
          else
            gh pr create --base "$GITHUB_REF_NAME" --head "$branch" \
              --title "Nightly: bump OpenModelica submodules ($today)" \
              --body "Automated nightly update of all OpenModelica-hosted submodule pointers to their upstream default branch, verified by a full \`install_dev.jl\` rebuild on this runner. JKRT-hosted forks are intentionally left untouched."
          fi
