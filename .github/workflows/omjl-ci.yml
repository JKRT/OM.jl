name: OM.jl integration

# Reusable workflow: every OM.jl package calls it from its own
# .github/workflows/omjl.yml, so a pull request in any package is tested
# together with OM.jl before it is merged.
#
# 1. Check out OM.jl and every sibling package at the branch that matches the
#    change (.github/actions/checkout-siblings: a PR's feature branch if it
#    exists in that repository, else the PR base branch or `line`, e.g. 1.13,
#    else master; after a merge the merged PR's branch first), in the layout of
#    OM.jl's submodules, with the package under test in its place.
# 2. Set up and precompile OM.jl (ci/setup.jl).
# 3. Run the package's own tests against the checked-out siblings
#    (ci/test-package.jl), then OM.jl's test suite (test/runtests.jl), also
#    when the package's own tests fail. The suite runs as parallel jobs, one
#    per group of test/runtests.jl (OM_TEST_GROUP); the package's own tests
#    run in the core job.
#
# The ci/ scripts come from the OM.jl checkout, so each OM.jl line (master,
# 1.13, ...) defines how it is tested. The checkout-siblings action is used
# from OM.jl's master branch, in OM.jl's own runs from the checked-out change.

on:
  workflow_call:
    inputs:
      package:
        description: Package under test, without .jl (OM for OM.jl itself)
        required: true
        type: string
      julia-versions:
        description: JSON list of Julia versions
        required: false
        type: string
        default: '["1.13"]'
      package-tests:
        description: Run the package's own tests against the siblings
        required: false
        type: boolean
        default: true
      om-tests:
        description: Run OM.jl's test suite
        required: false
        type: boolean
        default: true
      om-repository:
        description: Repository of OM.jl
        required: false
        type: string
        default: JKRT/OM.jl
      line:
        description: >
          Test against this line (e.g. 1.13) instead of the PR base branch or
          the pushed branch; for a package with one branch for all lines
        required: false
        type: string
        default: ""
      coverage:
        description: >
          Measure the coverage of OM.jl/src in OM.jl's tests and upload each
          group's lcov file (artifact coverage-<group>) for the caller's
          coverage job (OM.jl's CI.yml)
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: ${{ inputs.package }} with OM.jl, Julia ${{ matrix.julia }} (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        julia: ${{ fromJSON(inputs.julia-versions) }}
        group: [core, results, events, msl]
    env:
      # One strict precompile, at the end of ci/setup.jl.
      JULIA_PKG_PRECOMPILE_AUTO: "0"
      # Package images for any x86-64 runner with AVX2 instead of the runner's
      # own CPU: the runners are Intel or AMD, and a cache built on the other kind
      # was rejected, so ~90 packages were precompiled again in every run.
      JULIA_CPU_TARGET: x86-64-v3
    steps:
      - name: Check out OM.jl
        if: inputs.package != 'OM'
        uses: JKRT/OM.jl/.github/actions/checkout-siblings@master
        with:
          packages: OM
          path: .
          om-repository: ${{ inputs.om-repository }}
          line: ${{ inputs.line }}

      - name: Check out ${{ inputs.package }} (under test)
        uses: actions/checkout@v4
        with:
          path: ${{ inputs.package == 'OM' && 'OM.jl' || format('OM.jl/{0}.jl', inputs.package) }}

      # OM.jl's own runs use the action of the checked-out change, so a pull
      # request that changes it tests it; the other packages use master's.
      - name: Check out the other packages (OM.jl's action under test)
        if: inputs.package == 'OM'
        uses: ./OM.jl/.github/actions/checkout-siblings
        with:
          path: OM.jl
          exclude: ${{ inputs.package }}
          om-repository: ${{ inputs.om-repository }}
          line: ${{ inputs.line }}

      - name: Check out the other packages
        if: inputs.package != 'OM'
        uses: JKRT/OM.jl/.github/actions/checkout-siblings@master
        with:
          path: OM.jl
          exclude: ${{ inputs.package }}
          om-repository: ${{ inputs.om-repository }}
          line: ${{ inputs.line }}

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      - uses: julia-actions/cache@v2
        with:
          include-matrix: false  # the groups share one depot

      - name: Set up OM.jl
        id: setup
        run: julia --color=yes --project=OM.jl OM.jl/ci/setup.jl

      - name: ${{ inputs.package }} tests
        if: inputs.package-tests && inputs.package != 'OM' && matrix.group == 'core'
        env:
          PACKAGE: ${{ inputs.package }}
        run: julia --color=yes OM.jl/ci/test-package.jl "$PACKAGE"

      # Also after failing package tests: whether OM.jl still works is the point.
      # A test downloads the MSL reference results it compares against
      # (validateMSLModel in test/testUtils.jl).
      - name: OM.jl tests (${{ matrix.group }})
        if: ${{ !cancelled() && inputs.om-tests && steps.setup.outcome == 'success' }}
        working-directory: OM.jl/test
        env:
          OM_TEST_GROUP: ${{ matrix.group }}
          # OM.jl/src only: the siblings keep their cached package images
          COVERAGE_FLAG: ${{ inputs.coverage && format('--code-coverage=@{0}/OM.jl/src', github.workspace) || '' }}
        # With threads: OMFrontend's parallel path, as users run it (package tests: ci/test-package.jl).
        run: julia --color=yes --project=.. --threads=auto $COVERAGE_FLAG -e 'include("runtests.jl")'

      - name: Process coverage
        if: ${{ !cancelled() && inputs.coverage && steps.setup.outcome == 'success' }}
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: OM.jl/src

      - name: Upload the group's coverage
        if: ${{ !cancelled() && inputs.coverage && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}-julia${{ matrix.julia }}
          path: lcov.info
          retention-days: 14
          if-no-files-found: ignore
