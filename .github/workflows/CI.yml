name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # OM's Project.toml lives in the OM.jl subdir of the workspace; pin it so the
  # cache action and inline julia calls key off the same project.
  JULIA_PROJECT: OM.jl
  # Clone registries/packages straight from git instead of the Julia PkgServer.
  # pkg.julialang.org intermittently returns HTTP 404 for a registry treehash it
  # hasn't synced yet, which fails `Pkg.Registry.add`/`develop`; bypassing it
  # avoids that flake at the cost of slightly slower fetches.
  JULIA_PKG_SERVER: ""

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest, windows-latest]
        arch: [x64]
    steps:
      # OM and every sub-package are checked out as SIBLINGS in the workspace.
      # The packages' [sources] reference ../<name>.jl, and we Pkg.develop them
      # explicitly below. This mirrors OMFrontend.jl's working CI and avoids the
      # submodule-pointer + nested-path issues entirely.
      - name: Checkout OM.jl
        uses: actions/checkout@v4
        with:
          path: OM.jl
      - { name: Checkout Absyn.jl,              uses: actions/checkout@v4, with: { repository: OpenModelica/Absyn.jl,              ref: master, path: Absyn.jl } }
      - { name: Checkout ArrayUtil.jl,          uses: actions/checkout@v4, with: { repository: OpenModelica/ArrayUtil.jl,         ref: master, path: ArrayUtil.jl } }
      - { name: Checkout DAE.jl,                uses: actions/checkout@v4, with: { repository: OpenModelica/DAE.jl,               ref: master, path: DAE.jl } }
      - { name: Checkout DoubleEnded.jl,        uses: actions/checkout@v4, with: { repository: OpenModelica/DoubleEnded.jl,        ref: master, path: DoubleEnded.jl } }
      - { name: Checkout ImmutableList.jl,      uses: actions/checkout@v4, with: { repository: OpenModelica/ImmutableList.jl,      ref: master, path: ImmutableList.jl } }
      - { name: Checkout ListUtil.jl,           uses: actions/checkout@v4, with: { repository: OpenModelica/ListUtil.jl,           ref: master, path: ListUtil.jl } }
      - { name: Checkout MetaModelica.jl,       uses: actions/checkout@v4, with: { repository: OpenModelica/MetaModelica.jl,       ref: master, path: MetaModelica.jl } }
      - { name: Checkout OMBackend.jl,          uses: actions/checkout@v4, with: { repository: OpenModelica/OMBackend.jl,         ref: master, path: OMBackend.jl } }
      - { name: Checkout OMFrontend.jl,         uses: actions/checkout@v4, with: { repository: OpenModelica/OMFrontend.jl,         ref: master, path: OMFrontend.jl } }
      - { name: Checkout OMParser.jl,           uses: actions/checkout@v4, with: { repository: OpenModelica/OMParser.jl,           ref: master, path: OMParser.jl } }
      - { name: Checkout OMRuntimeExternalC.jl, uses: actions/checkout@v4, with: { repository: OpenModelica/OMRuntimeExternalC.jl, ref: master, path: OMRuntimeExternalC.jl } }
      - { name: Checkout SCode.jl,              uses: actions/checkout@v4, with: { repository: OpenModelica/SCode.jl,              ref: master, path: SCode.jl } }

      # libSimulationRuntimeC.so in the OMRuntimeExternalC.jl libs-v0.1.0
      # Linux zip has DT_NEEDED entries for liblapack.so.3, libblas.so.3 and
      # libgfortran.so.5. ubuntu-24.04 does not ship those by default, so
      # dlopen fails and every MSL / Spice3 / external-builtin test that goes
      # through structural_simplify chains down to it. The Windows
      # x86_64-mingw32 zip ships its own MinGW DLLs (libgfortran-5.dll,
      # libopenblas.dll, ...) so no install step is needed there.
      - name: Install OMC runtime system deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblapack3 libblas3 libgfortran5

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2
        with:
          cache-name: om-ci

      - name: Develop siblings, build native libs, precompile
        shell: bash
        working-directory: OM.jl
        # Disable auto-precompile so the native-lib build runs before precompile
        # (OMParser/OMRuntimeExternalC download shared libs in their build step).
        # Build only those two: OMBackend/OMFrontend build.jl are standalone-dev
        # scripts that Pkg.add deps from git and clobber the dev'd path sources.
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --color=yes --project -e '
            import Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git"))
            siblings = [
              "../Absyn.jl", "../ArrayUtil.jl", "../DAE.jl", "../DoubleEnded.jl",
              "../ImmutableList.jl", "../ListUtil.jl", "../MetaModelica.jl",
              "../OMBackend.jl", "../OMFrontend.jl", "../OMParser.jl",
              "../OMRuntimeExternalC.jl", "../SCode.jl",
            ]
            Pkg.develop([Pkg.PackageSpec(path = p) for p in siblings])
            # Test-only deps used by test/testUtils.jl but absent from OM [deps]
            # (already in the resolved manifest transitively; promote to direct).
            Pkg.add(["ADTypes", "Sundials", "Logging", "Test"])
            Pkg.build(["OMParser", "OMRuntimeExternalC"]; verbose=true)
            Pkg.resolve()
            Pkg.precompile()'

      - name: Test
        shell: bash
        working-directory: OM.jl/test     # runtests.jl guards pwd() == @__DIR__
        run: julia --color=yes --project=.. -e 'include("runtests.jl")'
