name: CI
on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version: ['1.12']
        os: [ubuntu-latest, windows-latest]
        arch: [x64]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - name: Add registries, build native libs, precompile
        shell: bash
        # Build BEFORE precompile: OMParser downloads its native shared
        # libraries in the build step, and OMBackend's precompile workload
        # loads OMParser. Disable auto-precompile during instantiate, build,
        # then precompile so the native libs exist first.
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --color=yes --project -e '
            import Pkg
            Pkg.Registry.add("General")
            Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git"))
            Pkg.instantiate()
            Pkg.build(; verbose=true)
            Pkg.precompile()'

      - uses: julia-actions/julia-runtest@v1

      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
