name: CI

# OM.jl with every sibling package at the matching branch, on Julia 1.12 and
# 1.13 (the same workflow the sibling packages call; see omjl-ci.yml).
on:
  pull_request:
  push:
    branches: [master, "1.13"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # julia-actions/cache deletes the caches it replaces

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs only; every push to master/1.13 is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  omjl:
    uses: ./.github/workflows/omjl-ci.yml
    with:
      package: OM
