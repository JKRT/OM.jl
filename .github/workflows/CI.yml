name: CI
on:
  pull_request:
  push:
    branches:
      - master
    tags: '*'
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            arch: 'x64'
            version: '1.7'
          - os: ubuntu-latest
            arch: 'x64'
            version: '1.7'
          - os: macos-latest
            arch: 'x64'
            version: '1.7'
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2
        with:
          cache-name: om-ci

      - name: Build
        # Use bash always to avoid having to escape quotes for Windows
        shell: bash
        run: julia --compiled-modules=no --color=yes --project -e 'import Pkg; Pkg.Registry.add("General"); Pkg.Registry.add(Pkg.RegistrySpec(url="https://github.com/OpenModelica/OpenModelicaRegistry.git")); Pkg.build(;verbose = true);Pkg.instantiate()'

      - name: Test
        uses: julia-actions/julia-runtest@v1

      - name: Calculate process coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Coverage report
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
