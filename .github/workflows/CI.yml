name: CI

# OM.jl with every sibling package at the matching branch: the 1.13 line on
# Julia 1.13, master too (the same workflow the sibling packages
# call; see omjl-ci.yml).
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/installer.yml'
      - '.github/workflows/update-submodules.yml'
      - '.github/workflows/committed-files.yml'
  push:
    branches: [master, "1.13"]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE*'
      - 'COPYING'
      - 'CITATION.bib'
      - '.gitignore'
      - '.github/workflows/docs.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/installer.yml'
      - '.github/workflows/update-submodules.yml'
      - '.github/workflows/committed-files.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # julia-actions/cache deletes the caches it replaces

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs only; every push to master/1.13 is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  omjl:
    uses: ./.github/workflows/omjl-ci.yml
    with:
      package: OM
      julia-versions: '["1.13"]'  # OM.jl's packages require Julia 1.13
      coverage: true

  # The groups' coverage of OM.jl/src merged: the percentage and a table per file in the job summary, the merged lcov
  # file an artifact; on master, when every group passed, coverage.json on gh-pages for the README's badge
  # (.github/actions/coverage; no external service).
  coverage:
    name: Coverage
    needs: omjl
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # the badge file on gh-pages
    steps:
      - uses: actions/checkout@v4

      - name: Download the groups' coverage
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: groups

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'

      - name: Summary and badge
        id: coverage
        uses: ./.github/actions/coverage
        with:
          lcov: groups/*/lcov.info
          name: OM.jl/src
          publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.omjl.result == 'success' }}

      - name: Upload the merged coverage
        if: steps.coverage.outputs.lcov != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-merged
          path: ${{ steps.coverage.outputs.lcov }}
          retention-days: 30
