name: CI

# OM.jl with every sibling package at the matching branch: the 1.13 line on
# Julia 1.13, master on 1.12 and 1.13 (the same workflow the sibling packages
# call; see omjl-ci.yml).
on:
  pull_request:
  push:
    branches: [master, "1.13"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # julia-actions/cache deletes the caches it replaces

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs only; every push to master/1.13 is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  omjl:
    uses: ./.github/workflows/omjl-ci.yml
    with:
      package: OM
      # The 1.13 line (pushes to 1.13, pull requests into it) is tested on Julia 1.13;
      # master on 1.12 and 1.13.
      julia-versions: ${{ (github.ref_name == '1.13' || github.base_ref == '1.13') && '["1.13"]' || '["1.12", "1.13"]' }}
