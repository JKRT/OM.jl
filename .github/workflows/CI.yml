name: CI

# OM.jl with every sibling package at the matching branch: the 1.13 line on
# Julia 1.13, master too (the same workflow the sibling packages
# call; see omjl-ci.yml).
on:
  pull_request:
  push:
    branches: [master, "1.13"]
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # julia-actions/cache deletes the caches it replaces

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs only; every push to master/1.13 is tested.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  omjl:
    uses: ./.github/workflows/omjl-ci.yml
    with:
      package: OM
      julia-versions: '["1.13"]'  # OM.jl's packages require Julia 1.13
